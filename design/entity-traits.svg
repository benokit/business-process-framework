<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica,Arial,sans-serif" font-size="12">
<style>.t{fill:#1f2937}.m{fill:#6b7280;font-size:11px}.b{font-weight:bold}.box{fill:#fff;stroke:#9ca3af;stroke-width:1.2}.hd{fill:#eef2ff;stroke:#6366f1;stroke-width:1.2}.dot{fill:#4f46e5}.ln{stroke:#e5e7eb}</style>
<rect width="900" height="600" fill="#fafafa"/>
<text x="20" y="28" class="t b" font-size="16">Entity traits: what a trait can do</text>
<text x="20" y="46" class="m">An entity is a set of traits; data maps each trait key to its value. A trait is an element of a kind extending entity-trait.</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6366f1"/></marker></defs>
<rect x="20" y="62" width="250" height="118" rx="8" class="box"/><text x="32" y="82" class="t b">entity-record</text>
<text x="32" y="100" class="m">id, entityType, businessKey, revision</text>
<text x="32" y="118" class="t">data: {</text>
<text x="46" y="134" class="m">business-key: …</text>
<text x="46" y="148" class="m">body: …</text>
<text x="46" y="162" class="m">state: …</text>
<text x="46" y="176" class="m">ownership: …</text>
<text x="32" y="176" class="t">}</text>
<path d="M270 120 H306" stroke="#6366f1" marker-end="url(#ar)" fill="none"/>
<rect x="310" y="62" width="570" height="118" rx="8" class="hd"/><text x="322" y="82" class="t b">trait = kind + configuration + cardinality (one | many); one key per trait</text>
<text x="322" y="103" class="t b">initialize</text><text x="322" y="116" class="m" font-size="9.5">initial value on create</text>
<text x="508" y="103" class="t b">operations</text><text x="508" y="116" class="m" font-size="9.5">put, amend, transition: return {command, value}</text>
<text x="694" y="103" class="t b">guard</text><text x="694" y="116" class="m" font-size="9.5">refuse a change (read-only)</text>
<text x="322" y="131" class="t b">react</text><text x="322" y="144" class="m" font-size="9.5">after the write, in the transaction</text>
<text x="508" y="131" class="t b">derive</text><text x="508" y="144" class="m" font-size="9.5">command from the record at each write</text>
<text x="694" y="131" class="t b">view</text><text x="694" y="144" class="m" font-size="9.5">what the record shows, at a date</text>
<text x="322" y="159" class="t b">messages</text><text x="322" y="172" class="m" font-size="9.5">deliver / receive between traits</text>
<text x="508" y="159" class="t b">entries</text><text x="508" y="172" class="m" font-size="9.5">start a process from outside</text>
<text x="694" y="159" class="t b">identity</text><text x="694" y="172" class="m" font-size="9.5">gives the businessKey</text>
<text x="20" y="197" class="t b">Capabilities by trait</text>
<rect x="20" y="205" width="746" height="302" rx="8" class="box"/>
<text x="222.0" y="225" text-anchor="middle" class="t b" font-size="11">initialize</text>
<text x="286.0" y="225" text-anchor="middle" class="t b" font-size="11">operations</text>
<text x="350.0" y="225" text-anchor="middle" class="t b" font-size="11">guard</text>
<text x="414.0" y="225" text-anchor="middle" class="t b" font-size="11">react</text>
<text x="478.0" y="225" text-anchor="middle" class="t b" font-size="11">derive</text>
<text x="542.0" y="225" text-anchor="middle" class="t b" font-size="11">view</text>
<text x="606.0" y="225" text-anchor="middle" class="t b" font-size="11">messages</text>
<text x="670.0" y="225" text-anchor="middle" class="t b" font-size="11">entries</text>
<text x="734.0" y="225" text-anchor="middle" class="t b" font-size="11">identity</text>
<line x1="20" x2="766" y1="237" y2="237" class="ln"/>
<text x="32" y="256" class="t">business-key</text>
<circle cx="222.0" cy="252" r="5.5" class="dot"/>
<circle cx="734.0" cy="252" r="5.5" class="dot"/>
<line x1="20" x2="766" y1="267" y2="267" class="ln"/>
<text x="32" y="286" class="t">body</text>
<circle cx="222.0" cy="282" r="5.5" class="dot"/>
<circle cx="286.0" cy="282" r="5.5" class="dot"/>
<line x1="20" x2="766" y1="297" y2="297" class="ln"/>
<text x="32" y="316" class="t">versioned-body</text>
<circle cx="222.0" cy="312" r="5.5" class="dot"/>
<circle cx="286.0" cy="312" r="5.5" class="dot"/>
<circle cx="542.0" cy="312" r="5.5" class="dot"/>
<line x1="20" x2="766" y1="327" y2="327" class="ln"/>
<text x="32" y="346" class="t">state</text>
<circle cx="222.0" cy="342" r="5.5" class="dot"/>
<circle cx="286.0" cy="342" r="5.5" class="dot"/>
<circle cx="350.0" cy="342" r="5.5" class="dot"/>
<line x1="20" x2="766" y1="357" y2="357" class="ln"/>
<text x="32" y="376" class="t">ownership</text>
<circle cx="222.0" cy="372" r="5.5" class="dot"/>
<circle cx="478.0" cy="372" r="5.5" class="dot"/>
<line x1="20" x2="766" y1="387" y2="387" class="ln"/>
<text x="32" y="406" class="t">validation</text>
<circle cx="222.0" cy="402" r="5.5" class="dot"/>
<circle cx="478.0" cy="402" r="5.5" class="dot"/>
<line x1="20" x2="766" y1="417" y2="417" class="ln"/>
<text x="32" y="436" class="t">generator</text>
<circle cx="222.0" cy="432" r="5.5" class="dot"/>
<circle cx="286.0" cy="432" r="5.5" class="dot"/>
<circle cx="350.0" cy="432" r="5.5" class="dot"/>
<circle cx="414.0" cy="432" r="5.5" class="dot"/>
<circle cx="606.0" cy="432" r="5.5" class="dot"/>
<circle cx="670.0" cy="432" r="5.5" class="dot"/>
<line x1="20" x2="766" y1="447" y2="447" class="ln"/>
<text x="32" y="466" class="t">generated</text>
<circle cx="222.0" cy="462" r="5.5" class="dot"/>
<circle cx="350.0" cy="462" r="5.5" class="dot"/>
<circle cx="414.0" cy="462" r="5.5" class="dot"/>
<circle cx="606.0" cy="462" r="5.5" class="dot"/>
<line x1="20" x2="766" y1="477" y2="477" class="ln"/>
<text x="32" y="496" class="t">amendment-generator</text>
<circle cx="222.0" cy="492" r="5.5" class="dot"/>
<circle cx="286.0" cy="492" r="5.5" class="dot"/>
<circle cx="350.0" cy="492" r="5.5" class="dot"/>
<circle cx="606.0" cy="492" r="5.5" class="dot"/>
<circle cx="670.0" cy="492" r="5.5" class="dot"/>
<text x="20" y="529" class="m">Packages: business-key, body, versioned-body in entities; state in entity-states; ownership; validation; generator, generated in entity-generation; amendment-generator in entity-amendments.</text>
<text x="20" y="545" class="m">A value changes only through a trait operation. A feature is added to an entity type by configuration, not by schema change.</text>
</svg>