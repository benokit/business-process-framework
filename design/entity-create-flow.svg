<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1206" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#445"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="38" font-size="20" font-weight="bold" fill="#123">Entity create: data flow from input to persistence</text>
<text x="40" y="60" fill="#556">left: process step (elements in entity-type, trait-container, entities-postgresql) · right: the data it produces</text>
<rect x="24" y="760" width="1012" height="372" rx="10" fill="#fff7e6" stroke="#d98e04" stroke-dasharray="6 4"/>
<text x="34" y="1118" fill="#a86400" font-weight="bold" font-size="12">inTransaction (rollback on any failure)</text>
<rect x="40" y="90" width="430" height="92" rx="8" fill="#e8f0fe" stroke="#3b5fc0" stroke-width="1.5"/>
<text x="52" y="112" font-weight="bold" fill="#123">1  create (entity-type operation)</text>
<text x="52" y="132" fill="#334">input: businessKey?, traits</text>
<line x1="255.0" y1="182" x2="255.0" y2="204" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560" y="96" width="460" height="80" rx="6" fill="#fafafa" stroke="#99a" />
<text x="570" y="114" font-weight="bold" fill="#445" font-size="12">create input</text>
<text x="570" y="132" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">{ businessKey?, traits }</text>
<line x1="470" y1="136.0" x2="560" y2="136.0" stroke="#99a" stroke-dasharray="3 3" marker-end="url(#a)"/>
<rect x="40" y="204" width="430" height="92" rx="8" fill="#e8f0fe" stroke="#3b5fc0" stroke-width="1.5"/>
<text x="52" y="226" font-weight="bold" fill="#123">2  initialTraitValues</text>
<text x="52" y="246" fill="#334">for every valued trait: trait.initialize(</text>
<text x="52" y="262" fill="#334">{ entityType, key, configuration, input: traits[key], create })</text>
<text x="52" y="278" fill="#334">body: ajv assert against the body schema</text>
<line x1="255.0" y1="296" x2="255.0" y2="318" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560" y="210" width="460" height="80" rx="6" fill="#fafafa" stroke="#99a" />
<text x="570" y="228" font-weight="bold" fill="#445" font-size="12">traits (becomes data)</text>
<text x="570" y="246" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">{ "business-key": "P-1",</text>
<text x="570" y="261" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">  body: {…}, &lt;valued trait&gt;: value }</text>
<line x1="470" y1="250.0" x2="560" y2="250.0" stroke="#99a" stroke-dasharray="3 3" marker-end="url(#a)"/>
<rect x="40" y="318" width="430" height="92" rx="8" fill="#e8f0fe" stroke="#3b5fc0" stroke-width="1.5"/>
<text x="52" y="340" font-weight="bold" fill="#123">3  identity key → businessKey</text>
<text x="52" y="360" fill="#334">identityKey = $func/entity-identity-key</text>
<text x="52" y="376" fill="#334">businessKey = traits[identityKey]</text>
<text x="52" y="392" fill="#334">none → throw invalid</text>
<line x1="255.0" y1="410" x2="255.0" y2="432" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560" y="324" width="460" height="80" rx="6" fill="#fafafa" stroke="#99a" />
<text x="570" y="342" font-weight="bold" fill="#445" font-size="12">businessKey</text>
<text x="570" y="360" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">"P-1"   (one string, value of the identity trait)</text>
<line x1="470" y1="364.0" x2="560" y2="364.0" stroke="#99a" stroke-dasharray="3 3" marker-end="url(#a)"/>
<rect x="40" y="432" width="430" height="92" rx="8" fill="#eef7ea" stroke="#3c8d2f" stroke-width="1.5"/>
<text x="52" y="454" font-weight="bold" fill="#123">4  applyChange: guards</text>
<text x="52" y="474" fill="#334">guardTraits (guard hook of each trait)</text>
<text x="52" y="490" fill="#334">+ slot requestGuards on operation 'create'</text>
<text x="52" y="506" fill="#334">read-only; a guard may throw</text>
<line x1="255.0" y1="524" x2="255.0" y2="546" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560" y="438" width="460" height="80" rx="6" fill="#fafafa" stroke="#99a" />
<text x="570" y="456" font-weight="bold" fill="#445" font-size="12">change (entity-change)</text>
<text x="570" y="474" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">{ operation: "create",</text>
<text x="570" y="489" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">  after: { businessKey, data: traits } }</text>
<line x1="470" y1="478.0" x2="560" y2="478.0" stroke="#99a" stroke-dasharray="3 3" marker-end="url(#a)"/>
<rect x="40" y="546" width="430" height="92" rx="8" fill="#eef7ea" stroke="#3c8d2f" stroke-width="1.5"/>
<text x="52" y="568" font-weight="bold" fill="#123">5  deriveData: fold of derive hooks</text>
<text x="52" y="588" fill="#334">each trait's derive sees data with the commands</text>
<text x="52" y="604" fill="#334">so far applied; returns a command or null</text>
<line x1="255.0" y1="638" x2="255.0" y2="660" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560" y="552" width="460" height="80" rx="6" fill="#fafafa" stroke="#99a" />
<text x="570" y="570" font-weight="bold" fill="#445" font-size="12">derived-data</text>
<text x="570" y="588" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">{ data: traits + derived values,</text>
<text x="570" y="603" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">  commands: [{ key, command, value }] }</text>
<line x1="470" y1="592.0" x2="560" y2="592.0" stroke="#99a" stroke-dasharray="3 3" marker-end="url(#a)"/>
<rect x="40" y="660" width="430" height="92" rx="8" fill="#e8f0fe" stroke="#3b5fc0" stroke-width="1.5"/>
<text x="52" y="682" font-weight="bold" fill="#123">6  store input</text>
<text x="52" y="702" fill="#334">$cond on change.operation = create</text>
<text x="52" y="718" fill="#334">→ operation: create, input = entity-create-input</text>
<line x1="255.0" y1="752" x2="255.0" y2="774" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560" y="666" width="460" height="80" rx="6" fill="#fafafa" stroke="#99a" />
<text x="570" y="684" font-weight="bold" fill="#445" font-size="12">entity-create-input</text>
<text x="570" y="702" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">{ entityType: self.id, businessKey,</text>
<text x="570" y="717" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">  data: derivation.data }</text>
<line x1="470" y1="706.0" x2="560" y2="706.0" stroke="#99a" stroke-dasharray="3 3" marker-end="url(#a)"/>
<rect x="40" y="774" width="430" height="92" rx="8" fill="#fde9e4" stroke="#c0432b" stroke-width="1.5"/>
<text x="52" y="796" font-weight="bold" fill="#123">7  inTransaction: entity-database.create</text>
<text x="52" y="816" fill="#334">create-entity query (postgresql-database)</text>
<text x="52" y="832" fill="#334">INSERT INTO entities (entity_type, business_key,</text>
<text x="52" y="848" fill="#334">data, timestamp_utc) RETURNING *  →  entity-row-record</text>
<line x1="255.0" y1="866" x2="255.0" y2="888" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560" y="780" width="460" height="80" rx="6" fill="#fafafa" stroke="#99a" />
<text x="570" y="798" font-weight="bold" fill="#445" font-size="12">entity-record (from the row)</text>
<text x="570" y="816" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">{ id, entityType, businessKey,</text>
<text x="570" y="831" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">  revision, data, timestampUtc }</text>
<text x="570" y="846" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">data column = JSONB: trait → value</text>
<line x1="470" y1="820.0" x2="560" y2="820.0" stroke="#99a" stroke-dasharray="3 3" marker-end="url(#a)"/>
<rect x="40" y="888" width="430" height="92" rx="8" fill="#e8f0fe" stroke="#3b5fc0" stroke-width="1.5"/>
<text x="52" y="910" font-weight="bold" fill="#123">8  reactions</text>
<text x="52" y="930" fill="#334">written = viewed-change(change + after: record)</text>
<text x="52" y="946" fill="#334">reactTraits, then slot 'reactions' on written</text>
<line x1="255.0" y1="980" x2="255.0" y2="1002" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560" y="894" width="460" height="80" rx="6" fill="#fafafa" stroke="#99a" />
<text x="570" y="912" font-weight="bold" fill="#445" font-size="12">written change</text>
<text x="570" y="930" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">{ operation: "create", after: record }</text>
<line x1="470" y1="934.0" x2="560" y2="934.0" stroke="#99a" stroke-dasharray="3 3" marker-end="url(#a)"/>
<rect x="40" y="1002" width="430" height="92" rx="8" fill="#e8f0fe" stroke="#3b5fc0" stroke-width="1.5"/>
<text x="52" y="1024" font-weight="bold" fill="#123">9  return (inside the transaction)</text>
<text x="52" y="1044" fill="#334">viewed-record(record, entityType)</text>
<rect x="560" y="1008" width="460" height="80" rx="6" fill="#fafafa" stroke="#99a" />
<text x="570" y="1026" font-weight="bold" fill="#445" font-size="12">viewed-entity-record</text>
<text x="570" y="1044" font-family="Menlo, monospace" font-size="12" fill="#223" xml:space="preserve">record with the views of the traits applied</text>
<line x1="470" y1="1048.0" x2="560" y2="1048.0" stroke="#99a" stroke-dasharray="3 3" marker-end="url(#a)"/>
<text x="40" y="1146" fill="#556" font-size="12">Failures: invalid (no business key, body fails its schema) · conflict (unique violation on entity_type + business_key) · guard errors.</text>
<text x="40" y="1164" fill="#556" font-size="12">Table entities holds the record (data as one JSONB column); revision starts at 1 (column default) and entity_history gets a row only on update.</text>
</svg>