<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1240" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#445"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="38" font-size="20" fill="#123" font-weight="bold" text-anchor="start">Traits: how a write evaluates them and how they act on each other</text>
<text x="40" y="60" font-size="12" fill="#556" font-weight="normal" text-anchor="start">left: the write path of the entity type (entity-type, trait-container) · right: what a trait sees and may do at each step</text>
<rect x="40" y="80" width="225" height="96" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="52" y="102" font-weight="bold" fill="#123">create</text>
<text x="52" y="122" fill="#334">initialTraitValues: each valued</text>
<text x="52" y="138" fill="#334">trait.initialize(input, create)</text>
<text x="52" y="154" fill="#334">identity trait → businessKey</text>
<text x="52" y="170" fill="#334">change { create, after }</text>
<rect x="305" y="80" width="225" height="96" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="317" y="102" font-weight="bold" fill="#123">run · command</text>
<text x="317" y="122" fill="#334">applyTraitOperations →</text>
<text x="317" y="138" fill="#334">traitCommands: trait.operation</text>
<text x="317" y="154" fill="#334">({ value, input }) returns</text>
<text x="317" y="170" fill="#334">{ command, value }; needs revision</text>
<rect x="570" y="80" width="225" height="96" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="582" y="102" font-weight="bold" fill="#123">run · plan</text>
<text x="582" y="122" fill="#334">process, in a transaction:</text>
<text x="582" y="138" fill="#334">trait.operation → { operations,</text>
<text x="582" y="154" fill="#334">output, commit }; commit:false</text>
<text x="582" y="170" fill="#334">= preview, nothing written</text>
<rect x="835" y="80" width="225" height="96" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="847" y="102" font-weight="bold" fill="#123">delete · derive</text>
<text x="847" y="122" fill="#334">delete: change { delete, before }</text>
<text x="847" y="138" fill="#334">derive: backfill after a rule</text>
<text x="847" y="154" fill="#334">changed, commands as one</text>
<text x="847" y="170" fill="#334">trait change</text>
<line x1="152" y1="176" x2="152" y2="196" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="417" y1="176" x2="417" y2="196" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="682" y1="176" x2="682" y2="196" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="947" y1="176" x2="947" y2="196" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="152" y1="196" x2="947" y2="196" stroke="#445" stroke-width="1.5"/>
<line x1="550" y1="196" x2="550" y2="214" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="214" width="620" height="62" rx="8" fill="#e8f0fe" stroke="#3b5fc0" stroke-width="1.5"/>
<text x="52" y="236" font-weight="bold" fill="#123">1  applyChange: revision check</text>
<text x="52" y="256" fill="#334">input.revision ≠ before.revision → throw conflict</text>
<line x1="350" y1="276" x2="350" y2="296" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="296" width="620" height="94" rx="8" fill="#fde8e8" stroke="#c03b3b" stroke-width="1.5"/>
<text x="52" y="318" font-weight="bold" fill="#123">2  guardTraits, then the guards slot</text>
<text x="52" y="338" fill="#334">for each trait, in the order of entity-traits: its hook guard({ entityType, key, configuration, change })</text>
<text x="52" y="354" fill="#334">read and trace only; throws to refuse; decides from change.operation</text>
<text x="52" y="370" fill="#334">then the fills of the slot guards that are on the operation</text>
<line x1="350" y1="390" x2="350" y2="410" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="410" width="620" height="124" rx="8" fill="#f3e8fe" stroke="#7a3bc0" stroke-width="1.5"/>
<text x="52" y="432" font-weight="bold" fill="#123">3  deriveData (not on delete): fold the derive hooks</text>
<text x="52" y="452" fill="#334">for each trait in order: derive({ entityType, key, configuration, record })</text>
<text x="52" y="468" fill="#334">record = the write with the commands so far applied (caller, initialize, earlier derives)</text>
<text x="52" y="484" fill="#334">→ { command, value } for its own key, or null · may add operations: [{ key, operation, input }]</text>
<text x="52" y="500" fill="#334">those operations of other traits → traitCommands → their commands join the change</text>
<path d="M660,440 C690,440 690,500 660,500" fill="none" stroke="#7a3bc0" stroke-width="1.2" marker-end="url(#a)"/>
<text x="650" y="432" font-size="11" fill="#7a3bc0" font-weight="normal" text-anchor="end">next trait</text>
<line x1="350" y1="534" x2="350" y2="554" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="554" width="620" height="86" rx="8" fill="#e8f0fe" stroke="#3b5fc0" stroke-width="1.5"/>
<text x="52" y="576" font-weight="bold" fill="#123">4  store: the change becomes values of keys</text>
<text x="52" y="596" fill="#334">create: after, as derived · trait: set each key to its command.value on before (whole value)</text>
<text x="52" y="612" fill="#334">delete: remove before · all commands of the change land in one revision</text>
<text x="52" y="628" fill="#334">command is metadata: stored nowhere, seen by guards, reactions, events</text>
<line x1="350" y1="640" x2="350" y2="660" stroke="#445" stroke-width="1.5"/>
<line x1="350" y1="660" x2="350" y2="676" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="660" width="652" height="296" rx="10" fill="#fff7e6" stroke="#d98e04" stroke-dasharray="6 4"/>
<text x="34" y="946" font-size="12" fill="#a86400" font-weight="bold" text-anchor="start">inTransaction (rollback on any failure)</text>
<rect x="40" y="676" width="620" height="62" rx="8" fill="#e8f0fe" stroke="#3b5fc0" stroke-width="1.5"/>
<text x="52" y="698" font-weight="bold" fill="#123">5  entity-database write</text>
<text x="52" y="718" fill="#334">store writes only if the record is still at the revision it read, else conflict</text>
<line x1="350" y1="738" x2="350" y2="758" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="758" width="620" height="94" rx="8" fill="#e8f7f3" stroke="#2f9a85" stroke-width="1.5"/>
<text x="52" y="780" font-weight="bold" fill="#123">6  reactTraits, then the reactions slot</text>
<text x="52" y="800" fill="#334">for each trait: react({ entityType, key, configuration, change }), change.after = written record</text>
<text x="52" y="816" fill="#334">may write other entities through their operations; a failure rolls the write back</text>
<text x="52" y="832" fill="#334">then the fills of the slot reactions, with the written change</text>
<line x1="350" y1="852" x2="350" y2="872" stroke="#445" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="872" width="620" height="62" rx="8" fill="#e8f0fe" stroke="#3b5fc0" stroke-width="1.5"/>
<text x="52" y="894" font-weight="bold" fill="#123">7  return the viewed record</text>
<text x="52" y="914" fill="#334">each trait view maps only its own value; the stored record is not what callers see</text>
<rect x="700" y="214" width="360" height="62" rx="6" fill="#fafafa" stroke="#99a"/>
<text x="710" y="232" font-weight="bold" fill="#445" font-size="12">Writes are optimistic</text>
<text x="710" y="250" fill="#223" font-size="12">every write names the revision it applies to</text>
<text x="710" y="265" fill="#223" font-size="12">guards decide on before, the store checks it again</text>
<line x1="660" y1="245" x2="700" y2="245" stroke="#99a" stroke-dasharray="3 3"/>
<rect x="700" y="296" width="360" height="94" rx="6" fill="#fafafa" stroke="#99a"/>
<text x="710" y="314" font-weight="bold" fill="#445" font-size="12">Guard: one trait decides on any change</text>
<text x="710" y="332" fill="#223" font-size="12">the change carries the commands of every trait</text>
<text x="710" y="347" fill="#223" font-size="12">state refuses update of body outside its states,</text>
<text x="710" y="362" fill="#223" font-size="12">with no fill: the behaviour travels with the trait</text>
<line x1="660" y1="343" x2="700" y2="343" stroke="#99a" stroke-dasharray="3 3"/>
<rect x="700" y="410" width="360" height="124" rx="6" fill="#fafafa" stroke="#99a"/>
<text x="710" y="428" font-weight="bold" fill="#445" font-size="12">Derive: traits feed one another in order</text>
<text x="710" y="446" fill="#223" font-size="12">order = entity-traits (kind chain, then data)</text>
<text x="710" y="461" fill="#223" font-size="12">a later derive sees the commands of earlier ones</text>
<text x="710" y="476" fill="#223" font-size="12">a derive can request a transition of state:</text>
<text x="710" y="491" fill="#223" font-size="12">operations → state.transition, same change</text>
<line x1="660" y1="472" x2="700" y2="472" stroke="#99a" stroke-dasharray="3 3"/>
<rect x="700" y="554" width="360" height="86" rx="6" fill="#fafafa" stroke="#99a"/>
<text x="710" y="572" font-weight="bold" fill="#445" font-size="12">One change, one revision</text>
<text x="710" y="590" fill="#223" font-size="12">commands from the caller, plan operations and</text>
<text x="710" y="605" fill="#223" font-size="12">derives are written together; no history is kept,</text>
<text x="710" y="620" fill="#223" font-size="12">a feature that needs one persists it in a reaction</text>
<line x1="660" y1="597" x2="700" y2="597" stroke="#99a" stroke-dasharray="3 3"/>
<rect x="700" y="758" width="360" height="94" rx="6" fill="#fafafa" stroke="#99a"/>
<text x="710" y="776" font-weight="bold" fill="#445" font-size="12">React: a trait acts on other entities</text>
<text x="710" y="794" fill="#223" font-size="12">an amending trait writes the amendments,</text>
<text x="710" y="809" fill="#223" font-size="12">inside the same transaction; if one fails,</text>
<text x="710" y="824" fill="#223" font-size="12">the write and what it created roll back</text>
<line x1="660" y1="805" x2="700" y2="805" stroke="#99a" stroke-dasharray="3 3"/>
<text x="40" y="978" font-size="15" fill="#123" font-weight="bold" text-anchor="start">How traits reach each other</text>
<rect x="40" y="1012" width="150" height="48" rx="8" fill="#e8f0fe" stroke="#3b5fc0" stroke-width="1.5"/>
<text x="115" y="1033" font-size="13" fill="#123" font-weight="bold" text-anchor="middle">body</text>
<text x="115" y="1050" font-size="11" fill="#334" font-weight="normal" text-anchor="middle">value of key body</text>
<rect x="330" y="1012" width="150" height="48" rx="8" fill="#fde8e8" stroke="#c03b3b" stroke-width="1.5"/>
<text x="405" y="1033" font-size="13" fill="#123" font-weight="bold" text-anchor="middle">state</text>
<text x="405" y="1050" font-size="11" fill="#334" font-weight="normal" text-anchor="middle">status, transitions</text>
<rect x="620" y="1012" width="150" height="48" rx="8" fill="#f3e8fe" stroke="#7a3bc0" stroke-width="1.5"/>
<text x="695" y="1033" font-size="13" fill="#123" font-weight="bold" text-anchor="middle">validations</text>
<text x="695" y="1050" font-size="11" fill="#334" font-weight="normal" text-anchor="middle">derives violations</text>
<rect x="910" y="1012" width="150" height="48" rx="8" fill="#e8f7f3" stroke="#2f9a85" stroke-width="1.5"/>
<text x="985" y="1033" font-size="13" fill="#123" font-weight="bold" text-anchor="middle">amending</text>
<text x="985" y="1050" font-size="11" fill="#334" font-weight="normal" text-anchor="middle">react writes other entities</text>
<path d="M330,1024 C280,1004 240,1004 190,1024" fill="none" stroke="#c03b3b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="260" y="1000" font-size="11" fill="#c03b3b" font-weight="normal" text-anchor="middle">guard refuses body operations</text>
<path d="M620,1024 C570,1004 530,1004 480,1024" fill="none" stroke="#7a3bc0" stroke-width="1.3" marker-end="url(#a)"/>
<text x="550" y="1000" font-size="11" fill="#7a3bc0" font-weight="normal" text-anchor="middle">derive asks transition (operations)</text>
<path d="M620,1052 C560,1080 260,1086 190,1052" fill="none" stroke="#7a3bc0" stroke-width="1.3" marker-end="url(#a)"/>
<text x="400" y="1088" font-size="11" fill="#7a3bc0" font-weight="normal" text-anchor="middle">derive reads the record by kind, with the earlier commands applied</text>
<rect x="40" y="1120" width="500" height="100" rx="6" fill="#fafafa" stroke="#99a"/>
<text x="50" y="1138" font-weight="bold" fill="#445" font-size="12">Before any write: a trait use is formed</text>
<text x="50" y="1156" fill="#223" font-size="12">key → { trait, configuration } is the deep union of the contributions:</text>
<text x="50" y="1171" fill="#223" font-size="12">fixed.traits of the kind chain · traits of the entity type · fills of the slot traits</text>
<text x="50" y="1186" fill="#223" font-size="12">the same path with another value is a conflict, nothing replaces anything</text>
<text x="50" y="1201" fill="#223" font-size="12">a trait may take over a key (versioned-body takes body)</text>
<rect x="560" y="1120" width="500" height="100" rx="6" fill="#fafafa" stroke="#99a"/>
<text x="570" y="1138" font-weight="bold" fill="#445" font-size="12">Reading across traits</text>
<text x="570" y="1156" fill="#223" font-size="12">never by path data.&lt;key&gt;: $func/entity-trait-value({ record, kind })</text>
<text x="570" y="1171" fill="#223" font-size="12">finds the use whose trait is an instance of the kind</text>
<text x="570" y="1186" fill="#223" font-size="12">the owner of a trait offers its own reader (record-state, record-body)</text>
<text x="570" y="1201" fill="#223" font-size="12">a view sees only its own value; hooks see the change of all traits</text>
</svg>
